<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>イベント詳細（申込フォーム）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Zen+Maru+Gothic:wght@700&amp;display=swap">
<style>
body{margin:0}
a{color:#0F6E8C}a:hover{color:#0B5268}
</style>
</helmet>
<div style="min-height: 100vh; background: #F4F6F8; font-family: 'Zen Kaku Gothic New', sans-serif; color: #1B2430; font-size: 15px; line-height: 1.75">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E2E6EA">
    <div style="max-width: 640px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 12px">
      <div style="width: 36px; height: 36px; border-radius: 10px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">ロゴ</div>
      <div style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 17px">CoderDojo 奈良</div>
    </div>
  </header>

  <main style="max-width: 640px; margin: 0 auto; padding: 16px 20px 40px; display: flex; flex-direction: column; gap: 20px">
    <a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; text-decoration: none; min-height: 44px; align-self: flex-start">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      イベント一覧
    </a>

    <section style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 14px; font-weight: 700; color: {{accent}}">2026年11月21日（土）</div>
      <h1 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-size: 24px; line-height: 1.45">はじめてのプログラミング体験会</h1>
      <div style="font-size: 14px; color: #4A5562">13:00–16:00・奈良市○○公民館・残り 8 席</div>
    </section>

    <form style="background: #FFFFFF; border: 2px solid {{accent}}; border-radius: 14px; padding: 18px 16px; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; align-items: center; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid #EEF1F4">
        <div style="flex: 0 0 40px; height: 40px; border-radius: 999px; background: color-mix(in srgb, {{accent}} 14%, #FFFFFF); color: {{accent}}; display: flex; align-items: center; justify-content: center; font-weight: 700">山</div>
        <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; line-height: 1.4">
          <span style="font-size: 12px; color: #4A5562">ログイン中</span>
          <span style="font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">hanako@example.com</span>
        </div>
        <button type="button" style="min-height: 44px; padding: 0 8px; border: none; background: none; color: #4A5562; font-family: inherit; font-size: 13px; text-decoration: underline; cursor: pointer">ログアウト</button>
      </div>

      <h2 style="margin: 0; font-size: 17px">申込フォーム</h2>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="f-name" style="font-size: 14px; font-weight: 700; display: flex; gap: 8px; align-items: center">お名前 <span style="font-size: 11px; font-weight: 700; color: #FFFFFF; background: #B42318; border-radius: 4px; padding: 0 6px">必須</span></label>
        <input id="f-name" type="text" value="山田 花子" style="min-height: 48px; padding: 0 12px; border: 1px solid #C7CED6; border-radius: 10px; font-family: inherit; font-size: 16px; color: #1B2430; background: #FFFFFF">
        <span style="font-size: 12px; color: #4A5562">Googleアカウントの名前が入っています。参加者のお名前に変えてください。</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="f-grade" style="font-size: 14px; font-weight: 700; display: flex; gap: 8px; align-items: center">学年 <span style="font-size: 11px; font-weight: 700; color: #FFFFFF; background: #B42318; border-radius: 4px; padding: 0 6px">必須</span></label>
        <select id="f-grade" style="min-height: 48px; padding: 0 12px; border: 1px solid #C7CED6; border-radius: 10px; font-family: inherit; font-size: 16px; color: #1B2430; background: #FFFFFF">
          <option>選んでください</option>
          <option>小1</option>
          <option>小2</option>
          <option>小3</option>
          <option>小4</option>
          <option>小5</option>
          <option>小6</option>
          <option>中学生</option>
        </select>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="f-note" style="font-size: 14px; font-weight: 700; display: flex; gap: 8px; align-items: center">連絡事項 <span style="font-size: 11px; font-weight: 700; color: #3A4552; background: #E6E9ED; border-radius: 4px; padding: 0 6px">任意</span></label>
        <textarea id="f-note" rows="3" placeholder="配慮してほしいことなどがあれば" style="padding: 10px 12px; border: 1px solid #C7CED6; border-radius: 10px; font-family: inherit; font-size: 16px; color: #1B2430; background: #FFFFFF; resize: vertical"></textarea>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <button type="submit" style="min-height: 52px; border: none; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">この内容で申し込む</button>
        <p style="margin: 0; font-size: 12px; color: #4A5562; line-height: 1.6">受付メールは hanako@example.com に届きます。申込データは開催の30日後に削除します。</p>
      </div>
    </form>

    <article style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 12px 0 0; font-size: 18px">どんなイベント？</h2>
      <p style="margin: 0">はじめてプログラミングにふれる小学生向けの体験会です。Scratchを使って、キャラクターを動かすところから始めます。</p>
    </article>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0F6E8C","options":["#0F6E8C","#2F5BD3","#B4421F","#2E7D4F"]},"$preview":{"width":390,"height":1320}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#0F6E8C' };
  }
}
</script>
</body>
</html>
