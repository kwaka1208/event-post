# PR と push で、型チェック・単体テスト・ビルド・ルールとスクリプトのテスト（エミュレーター）を実行する。
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Firestore エミュレーターに必要
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: エミュレーターをキャッシュ
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: 型チェック（画面とスクリプト）
        run: npm run check

      - name: 単体テスト
        run: npm test

      - name: ビルド
        run: npm run build

      - name: ルールとスクリプトのテスト（エミュレーター）
        run: npm run test:rules
