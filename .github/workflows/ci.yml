# PR と push で、検証・型チェック・単体テスト・ルールのテスト（エミュレーター）を実行する。
# 再設計版（web/、scripts/next/、tests/next/）の型チェック・ビルド・ルールと通知のテストも含む。
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Firestore エミュレーターに必要
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: エミュレーターをキャッシュ
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: config.yml とイベントを検証
        run: npm run validate

      - name: 型チェック
        run: npm run check

      - name: 単体テスト
        run: npm test

      - name: ルールと同期のテスト（エミュレーター）
        run: npm run test:rules

      - name: 再設計版の型チェック
        run: npm run web:check

      - name: 再設計版のビルド
        run: npm run web:build

      - name: 再設計版のルールと通知のテスト（エミュレーター）
        run: npm run test:next-rules
