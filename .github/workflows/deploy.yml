# main への push で、Firestore のルールとインデックスを反映してから、画面（web/）をビルドして GitHub Pages に公開する。
# ルールを画面より先に反映し、新しい画面が出た時点で Firestore 側が準備済みであるようにする。
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Secrets と Variables を登録する前（テンプレートそのものや、作った直後のリポジトリ）は、失敗させずに何もしない
  setup:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: セットアップが済んでいるか確かめる
        id: check
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
        run: |
          missing=()
          [ -n "$FIREBASE_SERVICE_ACCOUNT" ] || missing+=("Secret の FIREBASE_SERVICE_ACCOUNT")
          for name in FIREBASE_API_KEY FIREBASE_AUTH_DOMAIN FIREBASE_PROJECT_ID FIREBASE_APP_ID; do
            [ -n "${!name}" ] || missing+=("Variable の $name")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            list=$(printf '%s、' "${missing[@]}")
            list=${list%、}
            echo "::warning::${list} が登録されていないため、デプロイしませんでした。README のセットアップ手順を確かめてください"
            echo "### セットアップが終わっていないため、デプロイしませんでした" >> "$GITHUB_STEP_SUMMARY"
            echo "登録されていないもの：${list}。登録すると、次の push からデプロイします。README のセットアップ手順を確かめてください。" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: setup
    if: needs.setup.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # サービスアカウントの JSON から Application Default Credentials を作る（firebase-tools が使う）
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Firestore のルールとインデックスをデプロイ
        run: npx firebase deploy --only firestore --config firebase/firebase.json --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive

      - name: GitHub Pages の設定を読む
        id: pages
        uses: actions/configure-pages@v6

      # Firebase の Web 設定は公開してよい値。ビルドした JS に埋め込む（web/src/lib/firebase.ts）
      - name: 画面をビルド
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
